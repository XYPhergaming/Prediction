<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DEADPOOL VIP SUPREME V6 - ELITE ENGINE</title>
    <style>
        :root { --neon: #00ff41; --danger: #ff003c; --gold: #ffea00; --bg: #8b0000; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; user-select: none; overflow-x: hidden; }
        
        @keyframes glitch { 0% { transform: skew(0deg); } 20% { transform: skew(-3deg); text-shadow: 2px 2px var(--neon), -2px -2px var(--danger); } 40% { transform: skew(3deg); } 100% { transform: skew(0deg); } }
        @keyframes pulse { 0% { opacity: 0.6; } 100% { opacity: 1; text-shadow: 0 0 15px var(--neon); } }
        @keyframes scan { 0% { background-position: 0 0; } 100% { background-position: 0 100%; } }

        .header-container { text-align: center; padding: 30px 10px; }
        .zigzag-name { font-size: 38px; font-weight: 900; letter-spacing: 5px; color: #fff; text-transform: uppercase; text-shadow: 2px 2px var(--danger), -2px -2px var(--neon), 0 0 20px var(--neon); animation: glitch 1.5s infinite; }
        
        .glass-box { max-width: 400px; margin: 0 15px 20px; background: rgba(0,0,0,0.65); border: 1px solid rgba(0,255,65,0.3); border-radius: 25px; padding: 25px; backdrop-filter: blur(15px); text-align: center; }
        
        input { width: 90%; padding: 15px; background: rgba(0,0,0,0.75); border: 1px solid #444; border-radius: 12px; color: var(--neon); font-size: 16px; margin: 15px 0; outline: none; text-align: center; }
        .btn-main { width: 100%; padding: 15px; background: linear-gradient(45deg, var(--neon), #008f11); border: none; border-radius: 12px; color: #000; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        .btn-main:active { transform: scale(0.98); }
        
        .pred-val { font-size: 55px; font-weight: 900; margin: 10px 0; text-shadow: 0 0 20px var(--neon); animation: pulse 1.2s infinite alternate; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 11px; }
        th { color: #ddd; border-bottom: 1px solid #333; padding: 8px; background: rgba(0,0,0,0.3); }
        td { padding: 10px; border-bottom: 1px solid #2a2a2a; text-align: center; }
        
        .win { color: var(--neon); font-weight: bold; text-shadow: 0 0 10px var(--neon); }
        .loss { color: var(--danger); font-weight: bold; text-shadow: 0 0 10px var(--danger); }
        .jack { color: #ffea00 !important; font-weight: 900; text-shadow: 0 0 10px #ffea00; }
        
        .overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:999; backdrop-filter: blur(6px); }
        .admin-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; background: #0c0c0c; border: 2px solid var(--gold); border-radius: 20px; padding: 25px; z-index: 1000; box-shadow: 0 0 30px rgba(255, 234, 0, 0.3); }
        
        .hidden { display: none; }
        .footer-branding { margin-top: 30px; padding: 15px; text-align: center; }
        .name-box { display: inline-block; padding: 10px 30px; border: 1px solid var(--neon); border-radius: 5px; color: var(--neon); font-weight: bold; letter-spacing: 3px; cursor: pointer; background: rgba(0, 255, 65, 0.1); transition: all 0.3s; }
        .name-box:hover { background: rgba(0, 255, 65, 0.25); box-shadow: 0 0 12px var(--neon); }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #2a0000; }
        ::-webkit-scrollbar-thumb { background: var(--neon); border-radius: 10px; }
        
        .stats-badge { background: rgba(0,0,0,0.7); border-radius: 12px; padding: 8px; margin-top: 8px; font-size: 12px; display: flex; justify-content: space-between; border-left: 3px solid var(--neon); }
        .neon-text { color: var(--neon); }
    </style>
</head>
<body>

    <div class="header-container">
        <div class="zigzag-name">DEADPOOL VIP🌪</div>
        <div style="color: var(--gold); font-size: 10px; letter-spacing: 4px; margin-top: 5px;">PRIME ELITE ENGINE V6</div>
    </div>

    <div id="loginPage" class="glass-box">
        <h3 style="margin:0; color:var(--neon); font-size: 14px;">ENTER ELITE LICENSE</h3>
        <input type="text" id="keyIn" placeholder="ZENOX-VIP-XXXXX-XXXXX">
        <button class="btn-main" onclick="startSystem()">ACTIVATE SYSTEM</button>
        <p id="err" style="color:var(--danger); font-size: 12px; margin-top: 10px;"></p>
    </div>

    <div id="appPage" class="glass-box hidden">
        <div style="color: #ccc; font-size: 13px;" id="pID">PERIOD: ---</div>
        <div class="pred-val" id="pRes">WAIT...</div>
        <div style="color: var(--gold); font-size: 13px; font-weight: bold; border:1px dashed var(--gold); padding:8px; background: rgba(0,0,0,0.4);" id="pOpps">ANALYZING PATTERNS...</div>
        
        <div class="stats-badge">
            <span>📊 WIN RATE</span>
            <span id="winRateStat" class="neon-text">0%</span>

            <span id="streakStat" class="neon-text" style="color:var(--gold);">0</span>
        </div>
        
        <div style="max-height: 200px; overflow-y: auto; margin-top: 15px;">
            <table>
                <thead>
                    <tr><th>PRD</th><th>PRED</th><th>NUM</th><th>STATUS</th></tr>
                </thead>
                <tbody id="logs"></tbody>
            </table>
        </div>
        <button onclick="logout()" style="background:transparent; color:#aaa; border:none; margin-top:15px; font-size:10px; cursor:pointer;">LOGOUT SYSTEM</button>
    </div>

    <div class="footer-branding">
        <div class="name-box" onclick="triggerAdminLogin()">DEADPOOL VIP</div>
    </div>

    <div id="overlay" class="overlay hidden" onclick="closeAllModals()"></div>

    <div id="adminLoginModal" class="admin-modal hidden" style="border-color: var(--neon);">
        <h3 style="color: var(--neon); text-align: center; margin-top:0;">ADMIN LOGIN</h3>
        <input type="password" id="adminPassInput" placeholder="ENTER PASSWORD" style="width: 88%;">
        <div style="display: flex; gap: 10px;">
            <button class="btn-main" style="background: #222; color: #fff; font-size: 12px;" onclick="closeAllModals()">CANCEL</button>
            <button class="btn-main" style="font-size: 12px;" onclick="verifyAdminPass()">LOGIN</button>
        </div>
    </div>

    <div id="adminPanel" class="admin-modal hidden">
        <h3 style="color: var(--gold); text-align: center; margin-top:0;">MASTER KEY CONTROL</h3>
        <select id="keyValidity" style="width: 100%; padding: 12px; background: #111; color: #fff; border: 1px solid #444; border-radius: 8px;">
            <option value="30">30 MINUTES</option>
            <option value="1440">1 DAY</option>
            <option value="10080">7 DAYS</option>

        </select>
        <button class="btn-main" style="background: var(--gold); color: #000; margin-top: 15px;" onclick="genKey()">GENERATE SECURE KEY</button>
        <div id="outKey" style="margin-top: 15px; color: var(--neon); font-size: 11px; word-break: break-all; text-align: center; background: rgba(0,255,65,0.1); padding: 10px; border-radius: 8px; border: 1px solid var(--neon);">WAITING...</div>
        <hr style="border-color:#333;">
        <h4 style="color:var(--neon); font-size:12px; margin:8px 0;">⚡ ENGINE CONTROL</h4>
        <button class="btn-main" style="background:#222; color:var(--neon); font-size:12px;" onclick="resetAllStats()">RESET STATS</button>
    </div>
