<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Browser Terminal</title>
<style>
*,*::before,*::after{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
::selection{background:#2563eb;color:#fff}
html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui,-apple-system,sans-serif}
body{margin:0;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}
.justify-between{justify-content:space-between}.flex-1{flex:1 1 0%}.w-full{width:100%}
.p-4{padding:1rem}.px-4{padding-left:1rem;padding-right:1rem}
.py-2{padding-top:.5rem;padding-bottom:.5rem}.px-3{padding-left:.75rem;padding-right:.75rem}
.py-1{padding-top:.25rem;padding-bottom:.25rem}
.mb-1{margin-bottom:.25rem}.mb-4{margin-bottom:1rem}.mr-2{margin-right:.5rem}.gap-2{gap:.5rem}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
.font-sans{font-family:ui-sans-serif,system-ui,sans-serif}
.font-bold{font-weight:700}.text-sm{font-size:.875rem;line-height:1.25rem}
.text-lg{font-size:1.125rem}.whitespace-pre{white-space:pre}
.whitespace-pre-wrap{white-space:pre-wrap}.break-all{word-break:break-all}
.text-black{color:#000}.text-white{color:#fff}.text-red-600{color:#dc2626}
.text-blue-600{color:#2563eb}.text-green-600{color:#16a34a}.text-yellow-600{color:#ca8a04}
.bg-white{background:#fff}.bg-black{background:#000}.bg-blue-600{background:#2563eb}
.bg-gray-50{background:#f9fafb}
.border{border-width:1px;border-color:#d1d5db}.border-b{border-bottom-width:1px}
.rounded{border-radius:.25rem}
.hidden{display:none!important}
.overflow-y-auto{overflow-y:auto}.absolute{position:absolute}
.inset-0{top:0;right:0;bottom:0;left:0}.z-50{z-index:50}
.cursor-pointer{cursor:pointer}
.term{scrollbar-width:thin;touch-action:manipulation;user-select:text;-webkit-user-select:text}
.term::-webkit-scrollbar{width:8px}
.term::-webkit-scrollbar-thumb{background:rgba(128,128,128,.5);border-radius:4px}
.cursor-block{display:inline-block;width:.6em;height:1.2em;background:currentColor;
vertical-align:middle;animation:blink 1.2s step-end infinite;pointer-events:none;user-select:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
#capture{position:absolute;opacity:0;width:1px;height:1px;z-index:-1;pointer-events:none}
#workspace{position:relative;flex:1;overflow:hidden}
#editor-text{flex:1;width:100%;padding:1rem;background:#fff;color:#1f2937;
border:0;outline:0;font-family:ui-monospace,monospace;font-size:.875rem;resize:none}
#settings{background:rgba(0,0,0,.5);backdrop-filter:blur(4px);display:flex;
align-items:center;justify-content:center;padding:1rem}
.settings-card{background:#fff;border-radius:.75rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);
width:100%;max-width:28rem;overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.settings-card label{display:block;font-size:.875rem;font-weight:600;color:#374151;margin-bottom:.5rem}
.settings-card input,.settings-card select{width:100%;padding:.5rem .75rem;border:1px solid #d1d5db;
border-radius:.5rem;outline:0;color:#1f2937;background:#fff}
.settings-card input:focus,.settings-card select:focus{box-shadow:0 0 0 2px #2563eb;border-color:transparent}
</style>
</head>
<body class="font-mono text-sm">

<main id="workspace">
  <textarea id="capture" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
</main>

<div id="editor" class="hidden absolute inset-0 bg-white z-50 flex flex-col font-sans">
  <div class="bg-gray-50 px-4 py-2 border-b flex justify-between items-center">
    <input id="editor-name" type="text" value="file"
           style="flex:1;border:0;outline:0;background:transparent;color:#2563eb;font-weight:700;font-family:inherit;font-size:.875rem;padding:0;margin-right:.5rem">
    <div class="flex gap-2">
      <button id="editor-close" class="px-3 py-1 bg-white border rounded cursor-pointer">Close</button>
      <button id="editor-save" class="px-3 py-1 bg-blue-600 text-white rounded cursor-pointer">Save</button>
    </div>
  </div>
  <textarea id="editor-text" spellcheck="false"></textarea>
</div>

<div id="settings" class="hidden absolute inset-0 z-50 font-sans">
  <div class="settings-card">
    <div class="px-4 py-2 border-b flex justify-between items-center bg-gray-50">
      <h2 class="text-lg font-bold text-black">Terminal Settings</h2>
      <button id="settings-x" class="text-2xl font-bold text-black cursor-pointer">&times;</button>
    </div>
    <div class="p-4 flex-1 overflow-y-auto">
      <div class="mb-4">
        <label>User Name</label>
        <input type="text" id="s-user" value="user">
      </div>
      <div class="mb-4">
        <label>Font Colour</label>
        <select id="s-font">
          <option value="text-black">Black</option>
          <option value="text-white">White</option>
          <option value="text-green-600">Green</option>
        </select>
      </div>
      <div class="mb-4">
        <label>Background</label>
        <select id="s-bg">
          <option value="bg-white">White</option>
          <option value="bg-black">Black</option>
        </select>
      </div>
    </div>
    <div class="px-4 py-2 border-b flex justify-end gap-2 bg-gray-50">
      <button id="settings-cancel" class="px-3 py-1 bg-white border rounded cursor-pointer">Cancel</button>
      <button id="settings-save" class="px-3 py-1 bg-blue-600 text-white rounded cursor-pointer">Save</button>
    </div>
  </div>
</div>

<script>
'use strict';

const Storage = {
  db: null,
  init() {
    return new Promise((res, rej) => {
      const ensureStores = db => {
        if (!db.objectStoreNames.contains('vfs')) db.createObjectStore('vfs');
        if (!db.objectStoreNames.contains('system')) db.createObjectStore('system');
      };
      const open = (ver) => ver == null
        ? indexedDB.open('WebTermDB')
        : indexedDB.open('WebTermDB', ver);

      const first = open(null);
      first.onupgradeneeded = e => ensureStores(e.target.result);
      first.onblocked = () => rej(new Error('Database blocked. Close other tabs.'));
      first.onerror = e => rej(e.target.error);
      first.onsuccess = e => {
        const db = e.target.result;
        if (db.objectStoreNames.contains('vfs') && db.objectStoreNames.contains('system')) {
          this.db = db; res(); return;
        }
        const nextVersion = db.version + 1;
        db.close();
        const second = open(nextVersion);
        second.onupgradeneeded = e2 => ensureStores(e2.target.result);
        second.onblocked = () => rej(new Error('Upgrade blocked. Close other tabs.'));
        second.onerror = e2 => rej(e2.target.error);
        second.onsuccess = e2 => { this.db = e2.target.result; res(); };
      };
    });
  },
  _t(s, m) { return this.db.transaction(s, m).objectStore(s); },
  get(k, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readonly').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  set(k, v, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readwrite').put(v, k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  remove(k, s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readwrite').delete(k); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); },
  keys(s = 'vfs') { return new Promise((res, rej) => {
    const r = this._t(s, 'readonly').getAllKeys(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
};

const Utils = {
  escapeHTML(s) { return String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); },
  generateId() { return Math.random().toString(36).substring(2, 9); },
  resolvePath(cwd, p) {
    if (!p) return cwd;
    const parts = p.startsWith('/') ? p.split('/') : cwd.split('/').concat(p.split('/'));
    const r = [];
    for (const x of parts) {
      if (!x || x === '.') continue;
      if (x === '..') { if (r.length) r.pop(); } else r.push(x);
    }
    return '/' + r.join('/');
  },
  formatSize(b) {
    if (!b) return '0 B';
    const k = 1024, u = ['B','KB','MB','GB'];
    const i = Math.floor(Math.log(b) / Math.log(k));
    return (b / Math.pow(k, i)).toFixed(2) + ' ' + u[i];
  },
  truncate(s, n = 2000) {
    const x = String(s);
    return x.length > n ? x.slice(0, n) + '...' : x;
  },
};

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('webterm_settings') || '{}');
    return {
      username: (typeof s.username === 'string' && s.username.trim()) ? s.username : 'user',
      fontColor: ['text-black','text-white','text-green-600'].includes(s.fontColor) ? s.fontColor : 'text-black',
      bgColor: ['bg-white','bg-black'].includes(s.bgColor) ? s.bgColor : 'bg-white',
    };
  } catch (e) {
    return { username: 'user', fontColor: 'text-black', bgColor: 'bg-white' };
  }
}
const state = { session: null, settings: loadSettings(), devMounts: {} };

const Terminal = {
  version: '1.0.0',
  commands: {},
  extensions: {},
  runners: {},
  session: null,
  Storage, Utils,
  get settings() { return state.settings; },
  registerExtension(spec) {
    if (!spec || !spec.name) throw new Error('Extension must have a name');
    if (this.extensions[spec.name]) throw new Error('Extension already registered: ' + spec.name);
    this.extensions[spec.name] = spec;
    for (const [cmd, fn] of Object.entries(spec.commands || {})) {
      if (typeof fn !== 'function') continue;
      this.commands[cmd.toUpperCase()] = fn;
    }
    for (const [ext, fn] of Object.entries(spec.runners || {})) {
      if (typeof fn !== 'function') continue;
      this.runners[ext.toLowerCase()] = fn;
    }
  },
  unregisterExtension(name) {
    const spec = this.extensions[name];
    if (!spec) return;
    for (const c of Object.keys(spec.commands || {})) delete this.commands[c.toUpperCase()];
    for (const e of Object.keys(spec.runners || {})) delete this.runners[e.toLowerCase()];
    delete this.extensions[name];
  },
  async sha256(text) {
    const buf = new TextEncoder().encode(text);
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },
  print(t)       { if (this.session) this.session.print(t); },
  printSystem(t) { if (this.session) this.session.printSystem(t); },
  printError(t)  { if (this.session) this.session.printError(t); },
  printSuccess(t){ if (this.session) this.session.printSuccess(t); },
  get cwd()      { return this.session ? this.session.cwd : '/'; },
};
window.Terminal = Terminal;

const ExtensionManager = {
  baseUrl: 'https://xyphergaming.github.io/Prediction/',

  async loadRegistry(url, refresh = false) {
    const cacheKey = 'reg_' + url.split('/').pop();
    if (!refresh) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
    }
    try {
      const r = await fetch(url, { cache: refresh ? 'no-cache' : 'default' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      await Storage.set(cacheKey, data, 'system');
      return data;
    } catch (e) {
      const cached = await Storage.get(cacheKey, 'system');
      if (cached) return cached;
      throw new Error('Registry unavailable: ' + e.message);
    }
  },

  _loadAndRegister(entry, code, type) {
    try {
      new Function('Terminal', code)(Terminal);
    } catch (e) {
      // If partially registered before throwing, clean up
      if (Terminal.extensions[entry.name]) {
        Terminal.unregisterExtension(entry.name);
      }
      throw new Error('Load failed for ' + entry.name + ': ' + e.message);
    }
    const extObj = Terminal.extensions[entry.name];
    if (!extObj) {
      throw new Error('Extension did not register: ' + entry.name);
    }
    extObj.type = type;
    return extObj;
  },

  async installPkg(name, onProgress) {
    if (Terminal.extensions[name]) throw new Error('Package already installed: ' + name);

    const reg = await this.loadRegistry(this.baseUrl + 'pkg.json');
    const entry = reg.extensions.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!entry) throw new Error('Not in pkg.json: ' + name);

    if (onProgress) onProgress('Installing ' + entry.name + '...');
    const r = await fetch(entry.url);
    if (!r.ok) throw new Error('Download failed: HTTP ' + r.status);
    const code = await r.text();

    if (entry.sha256 && entry.sha256.length > 0) {
      const hash = await Terminal.sha256(code);
      if (hash !== entry.sha256) throw new Error('Integrity check failed for ' + entry.name);
    } else {
      console.warn('No sha256 for ' + entry.name + '; skipping integrity check.');
    }

    const extObj = this._loadAndRegister(entry, code, 'pkg');

    await Storage.set('ext:' + entry.name, code, 'system');
    await Storage.set('ext_type:' + entry.name, 'pkg', 'system');
    return { name: entry.name, info: extObj.info || 'Package installed successfully.' };
  },

  async installMaster(name, onProgress) {
    if (Terminal.extensions[name]) throw new Error('Master Key already imported: ' + name);

    const reg = await this.loadRegistry(this.baseUrl + 'master_key.json');
    const entry = reg.extensions.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!entry) throw new Error('Not in master_key.json: ' + name);

    if (onProgress) onProgress('Importing ' + entry.name + '...');
    const r = await fetch(entry.url);
    if (!r.ok) throw new Error('Import failed: HTTP ' + r.status);
    const code = await r.text();

    if (entry.sha256 && entry.sha256.length > 0) {
      const hash = await Terminal.sha256(code);
      if (hash !== entry.sha256) throw new Error('Integrity check failed for ' + entry.name);
    } else {
      console.warn('No sha256 for ' + entry.name + '; skipping integrity check.');
    }

    const extObj = this._loadAndRegister(entry, code, 'master');

    await Storage.set('ext:' + entry.name, code, 'system');
    await Storage.set('ext_type:' + entry.name, 'master', 'system');
    return { name: entry.name, info: extObj.info || 'Master Key imported successfully.' };
  },

  async remove(name) {
    const actualName = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === name.toLowerCase());
    if (actualName) {
      Terminal.unregisterExtension(actualName);
      await Storage.remove('ext:' + actualName, 'system');
      await Storage.remove('ext_type:' + actualName, 'system');
    }
  },

  async loadAll() {
    const keys = await Storage.keys('system');
    for (const key of keys) {
      if (typeof key !== 'string' || !key.startsWith('ext:')) continue;
      const name = key.slice(4);
      const code = await Storage.get(key, 'system');
      const type = await Storage.get('ext_type:' + name, 'system') || 'master';
      if (!code) continue;
      try {
        new Function('Terminal', code)(Terminal);
        if (Terminal.extensions[name]) Terminal.extensions[name].type = type;
      } catch (e) {
        console.warn('Failed to load ' + name + ': ' + e.message);
      }
    }
  },
};
window.ExtensionManager = ExtensionManager;

const COMMAND_REGISTRY = [
  { category: 'Keys', commands: [
    { usage: 'KEYS', description: 'List all commands' },
    { usage: 'CLEAR', description: 'Clear the screen' },
    { usage: '@user', description: 'Open settings' },
    { usage: '@key', description: 'Show built-in keys' },
    { usage: '@master_key', description: 'Show imported master keys' },
    { usage: '@pkg', description: 'Show installed packages' }
  ]},
  { category: 'Navigation', commands: [
    { usage: '*', description: 'List files, keys, and packages' },
    { usage: '?', description: 'List files in current folder' },
    { usage: '!', description: 'Show current path' },
    { usage: 'GO <folder>', description: 'Enter a folder' },
    { usage: '..GO', description: 'Go up one folder' }
  ]},
  { category: 'Files', commands: [
    { usage: 'CRE <file>', description: 'Create an empty file' },
    { usage: 'CREATE <folder>', description: 'Create a folder' },
    { usage: 'DEL(path)', description: 'Delete a file or folder' },
    { usage: 'EDIT <file>', description: 'Open a file in the editor' }
  ]},
  { category: 'Execution', commands: [
    { usage: 'RUN{name}', description: 'Run a package (e.g. RUN{python})' },
    { usage: 'RUN(file)', description: 'Run a file (e.g. RUN(app.py))' }
  ]},
  { category: 'Extensions', commands: [
    { usage: 'INX{...}', description: 'Install package or download URL' },
    { usage: 'INX.name', description: 'Import a master key (e.g. INX.master_key)' },
    { usage: 'REM{name}', description: 'Remove an extension' }
  ]},
  { category: 'Device', commands: [
    { usage: 'IN()', description: 'Mount a device folder' },
    { usage: 'IN(path)', description: 'Access mounted file/folder path' }
  ]},
  { category: 'Time', commands: [
    { usage: 'DATE', description: 'Show current date' },
    { usage: 'TIME', description: 'Show current time' }
  ]},
  { category: 'Chain', commands: [
    { usage: '&', description: 'Chain commands (e.g. DATE & TIME)' }
  ]}
];

class TerminalSession {
  constructor() {
    this.cwd = '/home/' + state.settings.username;
    this.history = [];
    this.historyIndex = -1;
    this.mode = 'shell';
    this.replBuffer = [];
    this.executing = false;
    this.closed = false;
    this.promptPrefix = '';

    this.container = document.createElement('div');
    this.container.className = 'term absolute inset-0 overflow-y-auto p-4 pb-20 flex flex-col ' + state.settings.fontColor;
    this.out = document.createElement('div');
    this.out.className = 'flex flex-col whitespace-pre-wrap break-all';
    this.input = document.createElement('div');
    this.input.className = 'flex items-center mt-1';
    this.promptEl = document.createElement('span');
    this.promptEl.className = 'mr-2 font-bold whitespace-pre';
    this.lineEl = document.createElement('span');
    this.lineEl.className = 'whitespace-pre';
    this.cursor = document.createElement('span');
    this.cursor.className = 'cursor-block';
    this.input.append(this.promptEl, this.lineEl, this.cursor);
    this.container.append(this.out, this.input);
    document.getElementById('workspace').appendChild(this.container);
    this.updatePrompt();
  }

  updatePrompt() {
    if (this.promptPrefix) {
      this.promptEl.innerHTML = '<span>' + Utils.escapeHTML(this.promptPrefix) + '</span>';
      return;
    }
    const home = '/home/' + state.settings.username;
    const u = state.settings.username;
    let label;
    if (this.cwd === home) label = u;
    else if (this.cwd.startsWith(home + '/')) label = u + this.cwd.slice(home.length);
    else label = this.cwd;
    this.promptEl.innerHTML = '<span class="font-bold">' + Utils.escapeHTML(label) + ':</span>';
  }

  print(html, isHtml = false) {
    const d = document.createElement('div');
    d.className = 'mb-1';
    if (isHtml) d.innerHTML = html; else d.textContent = html;
    this.out.appendChild(d);
    this.container.scrollTop = this.container.scrollHeight;
  }
  printSystem(t) { this.print('<span class="text-blue-600">' + Utils.escapeHTML(t) + '</span>', true); }
  printError(t)  { this.print('<span class="text-red-600">' + Utils.escapeHTML(t) + '</span>', true); }
  printSuccess(t){ this.print('<span class="text-yellow-600">' + Utils.escapeHTML(t) + '</span>', true); }

  clear() { this.out.innerHTML = ''; }

  updateLine() {
    const cap = document.getElementById('capture');
    this.lineEl.textContent = cap.value;
    this.updatePrompt();
    this.container.scrollTop = this.container.scrollHeight;
  }

  async processInput(input) {
    const cap = document.getElementById('capture');

    if (this.mode === 'python_input') {
      this.print(this.promptEl.innerHTML + Utils.escapeHTML(input), true);
      if (this._inputResolver) { this._inputResolver(input); this._inputResolver = null; }
      this.mode = 'python';
      this.promptPrefix = '>>> ';
      this.updatePrompt();
      return;
    }

    this.print(this.promptEl.innerHTML + ' ' + Utils.escapeHTML(input), true);
    if (this.mode === 'shell' && !input.trim()) return;
    if (input.trim()) { this.history.push(input); this.historyIndex = this.history.length; }

    if (this.mode === 'python') {
      const up = input.trim().toUpperCase();
      if (['EXIT', 'EXIT()', 'QUIT', 'QUIT()', 'EXIT(0)'].includes(up)) {
        this.mode = 'shell';
        this.replBuffer = [];
        this.promptPrefix = '';
        this.updatePrompt();
        return;
      }
      this.replBuffer.push(input);
      if (Terminal.commands['__PYTHON_EVAL__']) {
        try { await Terminal.commands['__PYTHON_EVAL__'].call(this, this.replBuffer); }
        catch (e) { this.printError(e.message || String(e)); }
      }
      return;
    }

    if (this.mode === 'sql') {
      const up = input.trim().toUpperCase();
      if (['EXIT', 'QUIT', 'EXIT()', 'QUIT()'].includes(up)) {
        this.mode = 'shell'; this.promptPrefix = ''; this.updatePrompt();
        this.printSystem('SQL session ended.');
        return;
      }
      if (Terminal.commands['__SQL_EVAL__']) {
        try { await Terminal.commands['__SQL_EVAL__'].call(this, input); }
        catch (e) { this.printError(e.message || String(e)); }
      }
      return;
    }

    // shell mode — split by & for chaining
    const parts = input.split('&').map(s => s.trim()).filter(Boolean);
    for (const part of parts) {
      const beforeMode = this.mode;
      try { await this._dispatchOne(part); }
      catch (e) { this.printError(e.message || String(e)); }
      if (this.mode !== beforeMode) break;
    }
  }

  async _dispatchOne(trimmed) {
    if (!trimmed) return;
    const upper = trimmed.toUpperCase();

    // INX{...}
    const mInxPkg = trimmed.match(/^INX\{(.*)\}$/i);
    if (mInxPkg) { await this.handleInxPkg(mInxPkg[1].trim()); return; }

    // INX.name
    const mInxMaster = trimmed.match(/^INX\.([a-zA-Z0-9_]+)$/i);
    if (mInxMaster) { await this.handleInxMaster(mInxMaster[1].trim()); return; }

    // REM{...}
    const mRem = trimmed.match(/^REM\{([^}]+)\}$/i);
    if (mRem) { await this.handleRem(mRem[1].trim()); return; }

    // RUN{...}
    const mRunPkg = trimmed.match(/^RUN\{([^}]+)\}$/i);
    if (mRunPkg) { await this.runPackage(mRunPkg[1].trim()); return; }

    // RUN(...)
    const mRunFile = trimmed.match(/^RUN\(([^)]*)\)$/i);
    if (mRunFile) {
      const file = mRunFile[1].trim();
      if (!file) throw new Error('Usage: RUN(file)');
      await this.cmdRun(file);
      return;
    }

    // Core handler exact match
    if (CORE_HANDLERS[upper]) {
      await CORE_HANDLERS[upper].call(this, trimmed);
      return;
    }

    // Core handler by verb prefix
    const verbMatch = upper.match(/^[@A-Z.?*!]+/);
    if (verbMatch && CORE_HANDLERS[verbMatch[0]]) {
      await CORE_HANDLERS[verbMatch[0]].call(this, trimmed);
      return;
    }

    // Extension command
    const tokens = trimmed.split(/\s+/);
    const cmdName = tokens[0].toUpperCase();
    if (Terminal.commands[cmdName]) {
      await Terminal.commands[cmdName].call(this, tokens.slice(1).join(' '));
      return;
    }

    throw new Error('Unknown command: ' + trimmed);
  }

  async runPackage(name) {
    const extKey = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === name.toLowerCase());
    if (!extKey) throw new Error('Package not installed: ' + name + ' (try INX{' + name + '})');
    const ext = Terminal.extensions[extKey];
    if (typeof ext.run !== 'function') throw new Error('Package cannot be run: ' + name);
    await ext.run.call(this);
  }

  async handleInxPkg(arg) {
    if (!arg) throw new Error('Usage: INX{package} or INX{url}');

    if (/^https?:\/\//i.test(arg)) {
      const id = Utils.generateId();
      this.print('<span id="' + id + '" class="text-blue-600">Downloading...</span>', true);
      try {
        const r = await fetch(arg);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const blob = await r.blob();
        const filename = (arg.split('/').pop() || 'file').split('?')[0];
        const vfsPath = '/downloads/' + filename;
        let content = '[Binary File: ' + blob.size + ' bytes]';
        if (blob.type.startsWith('text/') || filename.match(/\.(txt|md|js|json|css|html|py|sql)$/i)) {
          content = await blob.text();
        }
        await Storage.set(vfsPath, { type: 'file', content: content }, 'vfs');
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        const el = document.getElementById(id);
        if (el) { el.className = 'text-yellow-600'; el.textContent = 'Saved to: ' + vfsPath; }
      } catch (e) {
        const el = document.getElementById(id);
        if (el) { el.className = 'text-red-600'; el.textContent = 'Failed: ' + e.message; }
      }
      return;
    }

    const existing = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === arg.toLowerCase());
    if (existing) {
      this.printSystem(arg + ' is already installed.');
      return;
    }

    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Installing ' + Utils.escapeHTML(arg) + '...</span>', true);
    try {
      const res = await ExtensionManager.installPkg(arg, msg => {
        const el = document.getElementById(id);
        if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = 'Install failed: ' + e.message; }
    }
  }

  async handleInxMaster(name) {
    if (!name) throw new Error('Usage: INX.name (e.g. INX.master_key)');

    const existing = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === name.toLowerCase());
    if (existing) {
      this.printSystem(name + ' is already imported.');
      return;
    }

    const id = Utils.generateId();
    this.print('<span id="' + id + '" class="text-blue-600">Importing master key ' + Utils.escapeHTML(name) + '...</span>', true);
    try {
      const res = await ExtensionManager.installMaster(name, msg => {
        const el = document.getElementById(id);
        if (el) el.textContent = msg;
      });
      const el = document.getElementById(id);
      if (el) { el.className = 'text-yellow-600'; el.textContent = res.info; }
    } catch (e) {
      const el = document.getElementById(id);
      if (el) { el.className = 'text-red-600'; el.textContent = 'Import failed: ' + e.message; }
    }
  }

  async handleRem(name) {
    if (!name) throw new Error('Usage: REM{name}');
    const actualName = Object.keys(Terminal.extensions).find(k => k.toLowerCase() === name.toLowerCase());
    if (!actualName) throw new Error('Not installed: ' + name);
    await ExtensionManager.remove(actualName);
    this.printSuccess('Removed: ' + actualName);
  }

  async cmdRun(arg) {
    if (!arg) throw new Error('Usage: RUN(file)');

    const filename = arg.split('/').pop();
    const ext = '.' + (filename.split('.').pop() || '').toLowerCase();
    const target = Utils.resolvePath(this.cwd, arg);

    let content = null;

    const entry = await Storage.get(target, 'vfs');
    if (entry && entry.type === 'file') content = entry.content;

    if (content === null) {
      for (const [name, m] of Object.entries(state.devMounts)) {
        try {
          if (m.type === 'dir') {
            const fh = await m.handle.getFileHandle(filename);
            const f = await fh.getFile();
            content = await f.text();
            break;
          } else if (name === filename || name === arg) {
            const f = await m.handle.getFile();
            content = await f.text();
            break;
          }
        } catch (e) {}
      }
    }

    if (content === null) throw new Error('File not found: ' + arg);

    if (Terminal.runners[ext]) return Terminal.runners[ext].call(this, filename, content);
    if (ext === '.js' || ext === '.mjs') return this._execJS(content);
    if (ext === '.html' || ext === '.htm') return this._execHTML(filename, content);
    if (ext === '.css') return this._execCSS(filename, content);
    if (ext === '.json') {
      try { this.printSystem(JSON.stringify(JSON.parse(content), null, 2)); }
      catch (e) { this.printError('Invalid JSON: ' + e.message); }
      return;
    }
    if (['.md', '.txt', '.csv', '.log', '.ini', '.cfg', '.yaml', '.yml'].includes(ext)) {
      this.print(content); return;
    }
    // Unknown extension — just print content (per user request)
    this.print(content);
  }

  async _execJS(code) {
    const wCode = `
      const logs = [];
      for (const k of ['log','warn','error','info','debug']) {
        console[k] = (...a) => logs.push('[' + k + '] ' + a.map(x => {
          try { return typeof x === 'object' ? JSON.stringify(x) : String(x); }
          catch (_) { return String(x); }
        }).join(' '));
      }
      self.onmessage = e => {
        try {
          const r = eval(e.data);
          self.postMessage({ ok: true, result: String(r), logs });
        } catch (err) {
          self.postMessage({ ok: false, error: err.message, logs });
        }
      };
    `;
    const blob = new Blob([wCode], { type: 'application/javascript' });
    const url = URL.createObjectURL(blob);
    const w = new Worker(url);
    return new Promise(res => {
      let done = false;
      const finish = d => {
        if (done) return; done = true;
        clearTimeout(t);
        try { w.terminate(); } catch (e) {}
        URL.revokeObjectURL(url);
        if (d.logs) d.logs.forEach(l => this.printSystem(Utils.truncate(l)));
        if (!d.ok) this.printError('Error: ' + d.error);
        else if (d.result && d.result !== 'undefined') this.printSystem('Result: ' + Utils.truncate(d.result));
        res();
      };
      const t = setTimeout(() => finish({ ok: false, error: 'Timeout (5s)', logs: [] }), 5000);
      w.onmessage = e => finish(e.data);
      w.onerror = e => finish({ ok: false, error: e.message || 'Worker crashed', logs: [] });
      w.postMessage(code);
    });
  }

  _execHTML(filename, content) {
    const blob = new Blob([content], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if (!w) this.printError('Popup blocked; allow popups to preview.');
    else this.printSuccess('Opened ' + filename + ' in a new tab.');
  }

  _execCSS(filename, content) {
    const html = '<!DOCTYPE html><html><head><style>' + content + '</style></head><body>' +
      '<h1>CSS Preview</h1><p>Paragraph <a href="#">link</a></p>' +
      '<button>Button</button><div style="padding:12px;border:1px solid #ccc;margin-top:12px;">Box</div></body></html>';
    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const w = window.open(url, '_blank');
    if (!w) this.printError('Popup blocked; allow popups to preview.');
    else this.printSuccess('Opened ' + filename + ' preview.');
  }
}

const CORE_HANDLERS = {
  '@USER'() { UI.openSettings(); },
  CLEAR() { this.clear(); },

  KEYS() {
    for (const g of COMMAND_REGISTRY) {
      this.printSystem('[' + g.category + ']');
      for (const c of g.commands) {
        this.printSystem('  ' + c.usage.padEnd(24) + c.description);
      }
    }
    const extCmds = Object.keys(Terminal.commands).filter(k => !k.startsWith('__'));
    if (extCmds.length) {
      this.printSystem('[Package Commands]');
      for (const c of extCmds) this.printSystem('  ' + c);
    }
  },

  '@KEY'() {
    this.printSystem('[Key] - Core Commands');
    for (const g of COMMAND_REGISTRY) {
      for (const c of g.commands) {
        this.printSystem('  ' + c.usage.padEnd(24) + c.description);
      }
    }
  },
  '@MASTER_KEY'() {
    const list = Object.values(Terminal.extensions).filter(e => e.type === 'master');
    if (!list.length) { this.printSystem('No Master Keys imported.'); return; }
    this.printSystem('[Master Keys]');
    for (const e of list) this.printSystem('  ' + e.name);
  },
  '@PKG'() {
    const list = Object.values(Terminal.extensions).filter(e => e.type === 'pkg');
    if (!list.length) { this.printSystem('No Packages installed.'); return; }
    this.printSystem('[Packages]');
    for (const e of list) this.printSystem('  ' + e.name);
  },

  // * — everything (files + keys + packages)
  '*'() {
    return (async () => {
      this.printSystem('[Files]');
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) {
        if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      }
      const items = [];
      for (const n of firsts) {
        const e = await Storage.get(pfx + n, 'vfs');
        items.push([n, e || { type: 'file' }]);
      }
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else {
        for (const [n, e] of items) {
          if (e.type === 'dir') this.printSystem('  ' + n + '/');
          else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
        }
      }

      const masters = Object.values(Terminal.extensions).filter(e => e.type === 'master');
      this.printSystem('[Master Keys]');
      if (!masters.length) this.printSystem('  (none)');
      for (const e of masters) this.printSystem('  ' + e.name);

      const pkgs = Object.values(Terminal.extensions).filter(e => e.type === 'pkg');
      this.printSystem('[Packages]');
      if (!pkgs.length) this.printSystem('  (none)');
      for (const e of pkgs) this.printSystem('  ' + e.name);
    })();
  },

  // ? — current folder only
  '?'() {
    return (async () => {
      const all = await Storage.keys('vfs');
      const pfx = this.cwd === '/' ? '/' : this.cwd + '/';
      const firsts = new Set();
      for (const k of all) {
        if (k.startsWith(pfx) && k !== this.cwd) firsts.add(k.slice(pfx.length).split('/')[0]);
      }
      const items = [];
      for (const n of firsts) {
        const e = await Storage.get(pfx + n, 'vfs');
        items.push([n, e || { type: 'file' }]);
      }
      items.sort((a, b) => a[0].localeCompare(b[0]));
      if (!items.length) this.printSystem('  (empty)');
      else {
        for (const [n, e] of items) {
          if (e.type === 'dir') this.printSystem('  ' + n + '/');
          else this.printSystem('  ' + n + '  (' + Utils.formatSize((e.content || '').length) + ')');
        }
      }
    })();
  },

  // ! — current path
  '!'() { this.printSystem(this.cwd); },

  'GO'(raw) {
    const arg = raw.split(/\s+/).slice(1).join(' ').trim();
    return (async () => {
      if (!arg) throw new Error('Usage: GO <folder>');
      const t = Utils.resolvePath(this.cwd, arg);
      const e = await Storage.get(t, 'vfs');
      if (!e || e.type !== 'dir') throw new Error('Not a folder: ' + arg);
      this.cwd = t;
    })();
  },
  '..GO'() { this.cwd = Utils.resolvePath(this.cwd, '..'); },

  CRE(raw) {
    const name = raw.split(/\s+/).slice(1).join(' ').trim();
    return (async () => {
      if (!name) throw new Error('Usage: CRE <file>');
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('Already exists: ' + name);
      await Storage.set(t, { type: 'file', content: '' }, 'vfs');
      this.printSuccess('Created file: ' + name);
    })();
  },

  CREATE(raw) {
    const name = raw.split(/\s+/).slice(1).join(' ').trim();
    return (async () => {
      if (!name) throw new Error('Usage: CREATE <folder>');
      const t = Utils.resolvePath(this.cwd, name);
      if (await Storage.get(t, 'vfs')) throw new Error('Already exists: ' + name);
      await Storage.set(t, { type: 'dir' }, 'vfs');
      this.printSuccess('Created folder: ' + name);
    })();
  },

  DEL(raw) {
    const m = raw.match(/^DEL\((.*)\)$/i);
    if (!m) throw new Error('Unknown command: ' + raw);
    const name = m[1].trim();
    return (async () => {
      if (!name) throw new Error('Usage: DEL(path)');
      const t = Utils.resolvePath(this.cwd, name);
      const prot = new Set(['/', '/home', '/home/' + state.settings.username, '/downloads']);
      if (prot.has(t)) throw new Error('Core folder is protected.');
      const e = await Storage.get(t, 'vfs');
      if (!e) throw new Error('Not found: ' + name);
      if (e.type === 'dir') {
        const all = await Storage.keys('vfs');
        for (const k of all) if (k.startsWith(t + '/')) await Storage.remove(k, 'vfs');
      }
      await Storage.remove(t, 'vfs');
      this.printSuccess('Deleted: ' + name);
    })();
  },

  EDIT(raw) {
    const name = raw.split(/\s+/).slice(1).join(' ').trim();
    return (async () => {
      if (!name) throw new Error('Usage: EDIT <file>');
      const t = Utils.resolvePath(this.cwd, name);
      const e = await Storage.get(t, 'vfs');
      if (e && e.type === 'dir') throw new Error('Cannot edit a folder.');

      await new Promise(resolve => {
        const ov = document.getElementById('editor');
        const ta = document.getElementById('editor-text');
        const nameInput = document.getElementById('editor-name');
        nameInput.value = name;
        ov.classList.remove('hidden');
        ta.value = e ? e.content : '';
        ta.focus();

        const cl = document.getElementById('editor-close');
        const sv = document.getElementById('editor-save');

        const cleanup = () => {
          ov.classList.add('hidden');
          cl.onclick = null; sv.onclick = null;
          document.getElementById('capture').focus();
          resolve();
        };

        cl.onclick = () => cleanup();
        sv.onclick = async () => {
          const newName = (nameInput.value || '').trim() || name;
          const newPath = Utils.resolvePath(this.cwd, newName);

          try {
            if (newPath !== t) {
              if (await Storage.get(newPath, 'vfs')) {
                this.printError('Already exists: ' + newName);
                return;
              }
              await Storage.set(newPath, { type: 'file', content: ta.value }, 'vfs');
              if (e) await Storage.remove(t, 'vfs');
              this.printSuccess('Saved as: ' + newName);
            } else {
              await Storage.set(t, { type: 'file', content: ta.value }, 'vfs');
              this.printSuccess('Saved: ' + newName);
            }
          } catch (err) {
            this.printError('Save failed: ' + err.message);
            return;
          }
          cleanup();
        };
      });
    })();
  },

  DATE() { this.printSystem(new Date().toLocaleDateString()); },
  TIME() { this.printSystem(new Date().toLocaleTimeString()); },

  IN(raw) {
    const m = raw.match(/^IN\((.*)\)$/i);
    if (!m) throw new Error('Unknown command: ' + raw);
    const arg = m[1].trim();

    if (!arg) {
      return (async () => {
        if (!window.showDirectoryPicker) throw new Error('File System Access API not supported.');
        const h = await window.showDirectoryPicker({ mode: 'read' });
        state.devMounts[h.name] = { handle: h, type: 'dir' };
        this.printSuccess('Mounted: IN(' + h.name + ')');
      })();
    }

    return (async () => {
      const parts = arg.split('/').filter(Boolean);
      if (!parts.length) throw new Error('Empty path');
      const mountName = parts[0];
      const mount = state.devMounts[mountName];
      if (!mount) throw new Error('Not mounted: ' + mountName + ' (use IN() to mount)');

      if (mount.type === 'file') {
        if (parts.length > 1) throw new Error('Not a folder: ' + mountName);
        const f = await mount.handle.getFile();
        const text = await f.text();
        this.print(text.slice(0, 4000));
        return;
      }

      let current = mount.handle;
      for (let i = 1; i < parts.length; i++) {
        current = await current.getDirectoryHandle(parts[i]);
      }

      const entries = [];
      for await (const entry of current.values()) {
        entries.push(entry.kind === 'directory' ? entry.name + '/' : entry.name);
      }
      entries.sort();
      this.printSystem('[' + arg + ']');
      if (!entries.length) this.printSystem('  (empty)');
      for (const n of entries) this.printSystem('  ' + n);
    })();
  },
};

const UI = {
  init() {
    this.cap = document.getElementById('capture');

    document.getElementById('workspace').addEventListener('click', () => {
      const sel = window.getSelection();
      if (sel && sel.toString().length) return;
      if (state.session && state.session.mode !== 'python_input' && !state.session.closed) this.cap.focus();
    });

    document.addEventListener('paste', () => {
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      if (state.session && !this.cap.disabled) {
        this.cap.focus();
        setTimeout(() => state.session.updateLine(), 10);
      }
    });

    this.cap.addEventListener('input', () => {
      if (state.session) state.session.updateLine();
    });

    this.cap.addEventListener('keydown', async e => {
      const s = state.session;
      if (!s || s.closed) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        const v = this.cap.value;
        this.cap.value = '';
        s.updateLine();
        this.cap.disabled = true;
        try { await s.processInput(v); }
        catch (err) { s.printError(err.message || String(err)); }
        finally {
          if (!s.closed && s.mode !== 'python_input') { this.cap.disabled = false; this.cap.focus(); }
          if (!s.closed) s.updateLine();
        }
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (s.historyIndex > 0) { s.historyIndex--; this.cap.value = s.history[s.historyIndex]; s.updateLine(); }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (s.historyIndex < s.history.length - 1) { s.historyIndex++; this.cap.value = s.history[s.historyIndex]; }
        else { s.historyIndex = s.history.length; this.cap.value = ''; }
        s.updateLine();
      }
    });

    window.addEventListener('keydown', e => {
      if (e.ctrlKey && e.key.toLowerCase() === 'l') {
        if (!state.session) return;
        if (!document.getElementById('editor').classList.contains('hidden')) return;
        if (!document.getElementById('settings').classList.contains('hidden')) return;
        e.preventDefault();
        state.session.clear();
        return;
      }
      if (!e.ctrlKey || e.key.toLowerCase() !== 'c') return;
      if (!state.session) return;
      if (!document.getElementById('editor').classList.contains('hidden')) return;
      if (!document.getElementById('settings').classList.contains('hidden')) return;
      if (window.getSelection && window.getSelection().toString()) return;
      const s = state.session;
      if (Terminal.commands['__PYTHON_ABORT__'] && (s.executing || s.mode.startsWith('python'))) {
        e.preventDefault();
        Terminal.commands['__PYTHON_ABORT__'].call(s);
        this.cap.value = '';
        this.cap.disabled = false;
        this.cap.focus();
        return;
      }
      if (s.executing || s.mode.startsWith('python')) return;
      e.preventDefault();
      s.print(s.promptEl.innerHTML + ' ' + Utils.escapeHTML(this.cap.value) + '^C', true);
      this.cap.value = '';
      s.updateLine();
    });

    const closeSettings = () => {
      document.getElementById('settings').classList.add('hidden');
      this.cap.focus();
    };
    document.getElementById('settings-x').onclick = closeSettings;
    document.getElementById('settings-cancel').onclick = closeSettings;
    document.getElementById('settings-save').onclick = async () => {
      const oldUser = state.settings.username;
      const newUser = document.getElementById('s-user').value.trim() || 'user';
      const f = document.getElementById('s-font').value;
      const b = document.getElementById('s-bg').value;

      state.settings = { username: newUser, fontColor: f, bgColor: b };
      try { localStorage.setItem('webterm_settings', JSON.stringify(state.settings)); } catch (e) {}

      if (state.session && oldUser !== newUser) {
        const oldHome = '/home/' + oldUser;
        const newHome = '/home/' + newUser;
        if (state.session.cwd === oldHome || state.session.cwd.startsWith(oldHome + '/')) {
          const suffix = state.session.cwd.slice(oldHome.length);
          if (!(await Storage.get(newHome, 'vfs'))) {
            await Storage.set(newHome, { type: 'dir' }, 'vfs');
          }
          const target = newHome + suffix;
          state.session.cwd = (suffix && !(await Storage.get(target, 'vfs'))) ? newHome : target;
        }
      }

      this.applySettings();
      if (state.session) state.session.updateLine();
      closeSettings();
    };
  },

  openSettings() {
    document.getElementById('s-user').value = state.settings.username;
    document.getElementById('s-font').value = state.settings.fontColor;
    document.getElementById('s-bg').value = state.settings.bgColor;
    document.getElementById('settings').classList.remove('hidden');
  },

  applySettings() {
    const ws = document.getElementById('workspace');
    ws.style.background = state.settings.bgColor === 'bg-black' ? '#000' : '#fff';
    if (state.session) {
      state.session.container.className = 'term absolute inset-0 overflow-y-auto p-4 pb-20 flex flex-col ' + state.settings.fontColor;
      state.session.updatePrompt();
    }
  },

  createSession() {
    state.session = new TerminalSession();
    Terminal.session = state.session;
    this.applySettings();
    this.cap.focus();
  },
};

async function boot() {
  try {
    await Storage.init();

    const keys = await Storage.keys('system');
    for (const k of keys) {
      if (k.startsWith('ext_type:python') && (await Storage.get(k, 'system')) === 'master') {
        await Storage.set(k, 'pkg', 'system');
      }
    }

    if (!(await Storage.get('/', 'vfs'))) await Storage.set('/', { type: 'dir' }, 'vfs');
    if (!(await Storage.get('/home', 'vfs'))) await Storage.set('/home', { type: 'dir' }, 'vfs');
    if (!(await Storage.get('/downloads', 'vfs'))) await Storage.set('/downloads', { type: 'dir' }, 'vfs');

    const home = '/home/' + state.settings.username;
    if (!(await Storage.get(home, 'vfs'))) await Storage.set(home, { type: 'dir' }, 'vfs');

    await ExtensionManager.loadAll();

    UI.init();
    UI.createSession();
  } catch (e) {
    document.body.innerHTML = '<div style="padding:20px;color:red;font-family:sans-serif">Boot failure: ' +
      (e && e.message ? e.message.replace(/[<>]/g, '') : 'unknown') + '</div>';
  }
}
window.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
